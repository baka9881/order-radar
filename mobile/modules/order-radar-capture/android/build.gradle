plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.baka0406.orderradar.capture'
version = '1.0.0'

android {
  namespace "com.baka0406.orderradar.capture"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
